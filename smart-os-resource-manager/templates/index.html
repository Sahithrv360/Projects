<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart OS Resource Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand"> ⚙️ Smart OS Resource Manager </span>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
      <h2>System Dashboard</h2>
      <p class="text-muted">Monitor and analyze operating system resources.</p>

      <!-- Resource Cards -->
      <div class="row g-4 mt-2">
        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5>CPU Usage</h5>
              <h2 id="cpu">--%</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5>Memory Usage</h5>
              <h2 id="memory">--%</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5>Disk Usage</h5>
              <h2 id="disk">--%</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5>Processes</h5>
              <h2 id="processes">--</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- AI Section -->
      <div class="card shadow-sm mt-4">
        <div class="card-body">
          <h4>🤖 AI Resource Analyst</h4>

          <p class="text-muted">AI analysis will appear here.</p>

          <div id="ai-analysis">Waiting for system data...</div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
